# Optional: open the planner as a floating popup under Waybar instead of a
# tiled window. Paste into your Hyprland config (window class: timlo).
# Hyprland 0.53+ block syntax:
windowrule {
    name = timlo
    match:class = (timlo)
    float = true
    size = 520 720
    move = (monitor_w-540) 50
}

# Older Hyprland:
# windowrulev2 = float, class:^(timlo)$
# windowrulev2 = size 520 720, class:^(timlo)$
# windowrulev2 = move 100%-540 50, class:^(timlo)$
